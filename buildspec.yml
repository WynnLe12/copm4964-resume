version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing dependencies..."
      - npm ci

  pre_build:
    commands:
      - echo "Running automated tests..."
      - npm test

  build:
    commands:
      - echo "Building React website..."
      - npm run build

artifacts:
  base-directory: dist
  files:
    - '**/*'